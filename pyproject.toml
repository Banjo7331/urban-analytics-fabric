[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-analytics"
version = "0.1.2"
description = "Silver and gold transformations for the NYC mobility, air quality and economy lakehouse"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pyspark==3.5.3", "pytest>=8", "pyarrow>=14", "pandas>=2"]

[tool.setuptools.packages.find]
include = ["urban_analytics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
